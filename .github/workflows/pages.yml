# Publishes viewer/ (the reading app) to GitHub Pages. The app holds no papers: it reads them from the
# private library repo with a token entered on the reader's device.
name: pages
on:
  push:
    branches: [main]
    paths: ["viewer/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages             # (no url: the site's address is not shown on the repo's page)
    steps:
      - uses: actions/checkout@v4
      - name: Release tag in the links (a phone never mixes files of two releases)
        run: sed -i "s/__RELEASE__/${GITHUB_SHA::10}/g" viewer/index.html
      # The published copy without comments and spaces (the source here stays as written): two fifths less for a
      # phone to fetch and read. fonts/fonts.css is left as it is (sw.js reads its comments), and index.html too.
      - name: Minified
        run: npx --yes esbuild@0.24.0 viewer/app.js viewer/nav.js viewer/search-rules.js viewer/viewer.js viewer/marks.js viewer/prefs.js viewer/sw.js viewer/theme.css --minify --outdir=viewer --allow-overwrite --log-level=warning
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deploy
        uses: actions/deploy-pages@v4
