# Publishes viewer/ (the reading app) to GitHub Pages. The app holds no papers: it reads them from the
# private library repo with a token entered on the reader's device.
name: pages
on:
  push:
    branches: [main]
    paths: ["viewer/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Release tag in the links (a phone never mixes files of two releases)
        run: sed -i "s/__RELEASE__/${GITHUB_SHA::10}/g" viewer/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deploy
        uses: actions/deploy-pages@v4
